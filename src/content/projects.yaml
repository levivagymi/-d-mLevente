- id: laguna-lovasklub
  title: Laguna Lovasklub
  kind: client
  status: live
  period: 2022 – now
  role: Sole developer, from the first brief to handover and upkeep
  summary: Website of a riding club in Héreg, in Hungarian, English and German, with a webshop, blog and horse listings.
  problem: The club needed one site for its horses, competition results, news and shop that Hungarian, English and German visitors can all read.
  built:
    - A trilingual site (Hungarian, English, German) with its own URLs per language
    - Horse listings, competition results, a blog and a webshop
    - Backend on Supabase, deployed on Vercel
    - 'The legal pages a shop needs: privacy, cookies, terms, data processors, returns'
  result:
    - Live at lagunalovasklub.hu
    - Delivered on my own, from the first brief to handover, and still maintained by me
  stack: [Nuxt, Vue, Supabase, Vercel]
  links:
    live: https://www.lagunalovasklub.hu
  featured: true
  order: 1

- id: vityillo
  title: Vityilló Vendégház
  kind: client
  status: pre-launch
  period: '2026'
  role: Sole developer
  summary: Booking website for a guesthouse in Szomód, in Hungarian, English and German.
  problem: The guesthouse needed a site where guests can check availability and send a booking request in Hungarian, English or German, with forms that meet GDPR.
  built:
    - A statically generated Next.js (App Router) site in three languages
    - Availability check and booking request, with input validated by Zod schemas on the server
    - Booking and contact emails through Resend, Google reviews through SerpApi
    - Cookie consent, and a launch checklist covering legal, GDPR, security, accessibility and indexing
  result:
    - Feature-complete and in pre-launch review
    - Every remaining go/no-go item is tracked in the launch checklist, with an owner
  testing: 28 Vitest unit tests cover the API guard and the cookie consent.
  stack: [Next.js, React, TypeScript, Tailwind CSS, Zod, Resend, Vitest]
  links:
    code: https://github.com/levivagymi/vityill-
  featured: true
  order: 2

